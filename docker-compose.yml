services:
  jf-monitor:
    image: ${JF_MONITOR_IMAGE:-jf-monitor:1.0.0}
    container_name: jf-monitor
    ports:
      - "${JF_MONITOR_PORT:-8080}:8080"
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
