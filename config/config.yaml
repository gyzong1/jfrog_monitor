server:
  host: 0.0.0.0
  port: 18080
  scrape_interval: 15
  ui_refresh_interval: 15
  retention_days: 30

# Preferred shape. Legacy flat `nodes: []` still works (wrapped as cluster "default").
clusters: []

collectors:
  artifactory_metrics:
    enabled: true
    path: /artifactory/api/v1/metrics
  health_probe:
    enabled: true
    path: /artifactory/api/system/ping
    timeout_seconds: 5
  api_summary:
    enabled: true
    scrape_interval: 60
  prometheus_targets:
    enabled: true
    scrape_interval: 15
    targets: []
  remote_agents:
    enabled: true
    scrape_interval: 15
    endpoints: []
  api_intervals:
    health_ping: 15
    health_version: 3600
    artifactory_metrics: 15
    rtfs_metrics: 15
    license: 86400
    storageinfo: 3600
    storage_aql_monthly: 86400
    users: 600
    groups: 600
    permissions: 600
    tokens: 600
    projects: 300
    xray: 86400
    remote_agents: 15
    prometheus_targets: 15
    access_metrics: 15
  xray:
    enabled: true
    # Debug：采集时把 Violations 采样写入 data/xray_debug/（分析完请关闭）
    debug: false
    # 项目报告中每个仓库保留的漏洞明细条数上限（按严重级别排序；10–2000）
    repo_issue_detail_limit: 100
    # Violations API：v2（默认）| v1（约 5 万上限）
    violations_page_size: 500
    violations_max_pages: 10
    violations_page_concurrency: 4
    violations_fetch_mode: v2
    violations_include_details: summary
    violations_page_delay_ms: 100
    violations_retry_max: 3
    violations_retry_backoff_ms: 1000
    watch_incremental_enabled: true
    global_incremental_enabled: true
    event_fetch_cap: 400
    event_concurrency: 8
    timeout_seconds: 120
    eol_mode: watches
    eol_watches: []
    malicious_mode: watches
    malicious_watches: []
  # Demo：设置页可开关。开启写入约一周 Artifactory 演示时序（不含 Xray）；关闭清除 demo 数据。
  demo:
    enabled: false
    force: true
    include_xray: false

# 产品功能开关（仅配置文件；改后重启生效）
features:
  # Xray 安全总览（导航 + API + 采集）。默认 true
  xray: true
  # Support Bundle 离线分析（侧栏入口 + API）。默认 false
  support_bundle: false

ui:
  theme: light

thresholds:
  heap_usage_pct:
    warning: 75
    critical: 90
  disk_usage_pct:
    warning: 80
    critical: 90
  cpu_usage_pct:
    warning: 80
    critical: 95
  license_days_left:
    warning: 30
    critical: 7
